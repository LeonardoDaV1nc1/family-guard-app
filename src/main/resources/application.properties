spring.datasource.url=jdbc:postgresql://localhost:5432/seguranca_familiar_db
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Caminho para acessar a interface visual do Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Exibe o tempo de duração das requisições feitas pelo "Try it out"
springdoc.swagger-ui.display-request-duration=true

# Ordena as operações (métodos HTTP) por método (GET, POST, PUT, DELETE...)
springdoc.swagger-ui.operationsSorter=method

# Ordena as tags (controladores) alfabeticamente
springdoc.swagger-ui.tagsSorter=alpha

# Habilita o botão "Try it out" (Testar) por padrão ao abrir um endpoint
springdoc.swagger-ui.tryItOutEnabled=true

# Caminho para o JSON da documentação da API
springdoc.api-docs.path=/v3/api-docs

# Pacote onde o Swagger deve procurar pelos seus controllers
springdoc.packagesToScan=com.familysafety.controller

# Padrão de caminhos que o Swagger deve mapear
springdoc.pathsToMatch=/**